name: Validar Aurora

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    name: Manifiesto, cobertura y sincronía
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # canal.py resuelve el rango contra los tags reales
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar el sistema (manifiesto + cobertura + HTML)
        run: python scripts/validar-css.py

      - name: Lint de las recetas de examples/ y de las páginas del explorador
        run: python scripts/auditar-uso.py base.html stress-test.html examples/*.html iconos/index.html

      - name: Coherencia entre páginas, demos y versiones
        run: python scripts/auditar-coherencia.py --check

      - name: Auditoría de tema (supervivencia al modo oscuro)
        run: python scripts/audit-tema.py

      - name: Auditoría de accesibilidad de las demos
        run: python scripts/audit-a11y.py

      - name: Lint de la capa generativa (demo)
        run: python scripts/auditar-uso.py openui/index.html

      - name: Capa OpenUI (sin deriva entre fuente, spec, prompt y runtime)
        run: |
          python scripts/generar-openui.py --check
          python scripts/auditar-openui.py

      - name: Plantillas por arquetipo (todas válidas y con su índice al día)
        run: |
          python scripts/plantilla.py --validar-todas
          python scripts/plantilla.py --index
          git diff --quiet -- openui/plantillas/index.json || (echo "::error::El índice de plantillas está desfasado: ejecuta plantilla.py --index" && exit 1)

      - name: Conector brief → página (sin red)
        run: |
          python scripts/generar-web.py --brief briefs/panel-ferroviaria.json --sin-modelo -o /tmp/gw
          python scripts/auditar-uso.py /tmp/gw/ferroviaria-panel.html

      - name: Iconos numerados (numeración, fichas, licencia, sprite y catálogo)
        run: |
          python scripts/iconos.py --check
          python scripts/auditar-iconos.py --check

      - name: Canales y versiones en orden
        run: python scripts/canal.py --check

      - name: Comprobar la sintaxis del JavaScript
        run: |
          node --check js/catalog.js
          node --check js/base-datos.js
          node --check js/iconos.js
          node --check openui/aurora-openui.js

      - name: Base de datos de diseño (integridad y sincronía)
        run: |
          python scripts/generar-base-datos.py --check
          python scripts/auditar-base.py --check --min-familias 411 --min-tokens 189

      - name: Responsive multifunción (container queries y stress test)
        run: python scripts/auditar-responsive.py

      - name: Regenerar y comprobar que no hay diferencias
        run: |
          python scripts/generar-base-datos.py
          python scripts/generar-llm-docs.py
          python scripts/generar-openui.py
          python scripts/build-catalog.py
          python scripts/audit-catalog.py
          python scripts/audit-html.py
          if ! git diff --quiet -- index.html paginas datos packs/all.css audit components.json LLM.md llms.txt combos openui iconos; then
            echo "::error::Lo generado no coincide con lo commiteado. Ejecuta generar-base-datos.py, generar-llm-docs.py, generar-openui.py, build-catalog.py, audit-catalog.py y audit-html.py, y commitea el resultado."
            git --no-pager diff --stat -- index.html paginas datos packs/all.css audit components.json LLM.md llms.txt combos iconos
            exit 1
          fi
          echo "Catálogo, base de datos, API LLM e informe de auditoría sincronizados con specs/ y los packs."

      - name: Resumen de la auditoría
        run: |
          echo "### Aurora · auditoría" >> $GITHUB_STEP_SUMMARY
          sed -n '1,20p' audit/AUDITORIA.md >> $GITHUB_STEP_SUMMARY

      - name: Publicar el informe de auditoría
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-aurora
          path: audit/
          if-no-files-found: ignore
